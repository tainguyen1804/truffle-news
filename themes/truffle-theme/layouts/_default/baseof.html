<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Param "description" | default .Site.Params.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ "feed.xml" | relURL }}">
</head>
<body class="{{ if .Site.Params.darkMode }}dark-mode{{ end }}">
    <header class="site-header">
        <div class="header-inner">
            <a href="{{ "" | relURL }}" class="logo">🍄 <span>Truffle</span> News</a>
            <nav class="main-nav">
                <a href="{{ "" | relURL }}">Trang chủ</a>
                <a href="{{ "posts" | relURL }}">Bài viết</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-brand">PigWorks Group 🐗</div>
            <div class="footer-meta">© {{ now.Format "2006" }} · Tin tức tổng hợp mỗi ngày</div>
        </div>
    </footer>
</body>
</html>
