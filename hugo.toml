baseURL = "https://tainguyen1804.github.io/truffle-news/"
locale = "vi-VN"
title = "Truffle News"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  description = "Tin tức tổng hợp mỗi ngày — công nghệ, đời sống, kinh tế, khoa học"
  author = "PigWorks Group"
  copyright = "© 2026 PigWorks Group"
  DateFormat = "02/01/2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowFullTextinRSS = false

  # Google Analytics
  analytics.google.SiteVerificationTag = "google-site-verification"
  analytics.google.id = "G-QLG8BZ624J"

  [params.homeInfoParams]
    Title = "🍄 Truffle News"
    Content = "Tin tức tổng hợp mỗi ngày — được chọn lọc bởi **PigWorks Group** 🐗"

  [params.profileMode]
    enabled = false

  # Giscus Comments
  [params.giscus]
    repo = "tainguyen1804/truffle-news"
    repoId = "R_kgDOSx3Zpg"
    category = "Announcements"
    categoryId = "DIC_kwDOSx3Zps4C-j3B"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    theme = "preferred_color_scheme"
    lang = "vi"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Bài viết"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "Chuyên mục"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]
