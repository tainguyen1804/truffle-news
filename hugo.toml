baseURL = "https://tainguyen1804.github.io/truffle-news/"
locale = "vi-VN"
title = "Truffle News"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  description = "Tin tức tổng hợp mỗi ngày — công nghệ, đời sống, kinh tế, khoa học"
  author = "PigWorks Group"
  copyright = "© 2026 PigWorks Group"
  DateFormat = "02/01/2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowFullTextinRSS = false

  [params.homeInfoParams]
    Title = "🍄 Truffle News"
    Content = "Tin tức tổng hợp mỗi ngày — được chọn lọc bởi **PigWorks Group** 🐗"

  [params.profileMode]
    enabled = false

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Bài viết"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "Chuyên mục"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]
