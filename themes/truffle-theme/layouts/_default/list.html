{{ define "main" }}
<section class="archive-page">
    <h1>📄 Tất cả bài viết</h1>
    <div class="post-list">
        {{ range .Pages.ByDate.Reverse }}
        <article class="post-item">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02/01/2006" }}</time>
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        </article>
        {{ end }}
    </div>
</section>
{{ end }}
