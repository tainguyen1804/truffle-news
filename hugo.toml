baseURL = "https://tainguyen1804.github.io/truffle-news/"
locale = "vi-VN"
title = "Truffle News"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false

[sitemap]
  changefreq = "daily"
  priority = 0.8
  filename = "sitemap.xml"

# ===== Cover =====
cover.linkFullImages = true
cover.responsiveImages = true
cover.hiddenInList = false
cover.hiddenInSingle = true

# ===== Social & SEO =====
[params]
  description = "Tin tức tổng hợp mỗi ngày — công nghệ, đời sống, kinh tế, khoa học"
  author = "PigWorks Group"
  copyright = "© 2026 PigWorks Group"
  DateFormat = "02/01/2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowFullTextinRSS = false
  ShowRssButtonInSectionTermList = true
  comments = true
  hideFooter = false
  mainSections = ["posts"]

  # Social icons
  social = true
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/tainguyen1804/truffle-news"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  # Google Analytics
  analytics.google.SiteVerificationTag = "google-site-verification"
  analytics.google.id = "G-QLG8BZ624J"

  # ===== Home Page Style =====
  [params.homeInfoParams]
    Title = "🍄 Truffle News"
    Content = "Tin tức tổng hợp mỗi ngày — được chọn lọc bởi **PigWorks Group** 🐗"

  [params.profileMode]
    enabled = false

  # ===== Article Card Style =====
  [params.assets]
    favicon = "/favicon.ico"

  # ===== Comments =====
  [params.giscus]
    repo = "tainguyen1804/truffle-news"
    repoId = "R_kgDOSx3Zpg"
    category = "Announcements"
    categoryId = "DIC_kwDOSx3Zps4C-j3B"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    theme = "preferred_color_scheme"
    lang = "vi"

# ===== Menu =====
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "📰 Bài viết"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "🏷️ Chuyên mục"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "🔖 Tags"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    identifier = "search"
    name = "🔍 Tìm"
    url = "/search/"
    weight = 4

# ===== Outputs =====
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

# ===== Search =====
[outputFormats]
  [outputFormats.JSON]
    baseName = "index"
    isPlainText = true
    mediaType = "application/json"
    notAlternative = true
